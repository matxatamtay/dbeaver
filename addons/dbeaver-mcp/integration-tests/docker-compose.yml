services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teststudio
      POSTGRES_USER: teststudio
      POSTGRES_PASSWORD: teststudio
    ports:
      - "${TESTSTUDIO_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teststudio -d teststudio"]
      interval: 2s
      timeout: 3s
      retries: 40
    tmpfs:
      - /var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: teststudio
      MYSQL_USER: teststudio
      MYSQL_PASSWORD: teststudio
      MYSQL_ROOT_PASSWORD: root-teststudio
    ports:
      - "${TESTSTUDIO_MYSQL_PORT:-53307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot-teststudio"]
      interval: 3s
      timeout: 4s
      retries: 50
    tmpfs:
      - /var/lib/mysql

name: Upstream compatibility

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: echo "value=$(jq -c '[.supported[], .best_effort[]]' config/compatibility-matrix.json)" >> "$GITHUB_OUTPUT"

  compile:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    continue-on-error: ${{ matrix.target.required == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq rsync
      - name: Clone ${{ matrix.target.name }} target
        run: |
          git clone --depth 1 --branch '${{ matrix.target.dbeaver_ref }}' https://github.com/dbeaver/dbeaver.git ../dbeaver-target
          git clone --depth 1 --branch devel https://github.com/dbeaver/dbeaver-common.git ../dbeaver-common
      - name: Build and test compatibility
        env:
          DBEAVER_UPSTREAM: ${{ github.workspace }}/../dbeaver-target
          DBEAVER_COMMON: ${{ github.workspace }}/../dbeaver-common
        run: |
          ./scripts/validate.sh
          ./scripts/build.sh
          ./scripts/test.sh
          ./scripts/compat-report.sh > "dist/compatibility-${{ matrix.target.name }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.target.name }}
          path: |
            dist/compatibility-${{ matrix.target.name }}.json
            dist/SHA256SUMS
          if-no-files-found: warn

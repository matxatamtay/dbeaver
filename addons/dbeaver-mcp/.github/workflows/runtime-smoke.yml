name: DBeaver runtime smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 3'

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install desktop/build dependencies
        run: sudo apt-get update && sudo apt-get install -y jq rsync xvfb curl
      - name: Clone current supported DBeaver
        run: |
          ref=$(jq -r '.supported[] | select(.name=="current") | .dbeaver_ref' config/compatibility-matrix.json)
          git clone --depth 1 --branch "$ref" https://github.com/dbeaver/dbeaver.git ../dbeaver-target
          git clone --depth 1 --branch devel https://github.com/dbeaver/dbeaver-common.git ../dbeaver-common
      - name: Build add-on
        env:
          DBEAVER_UPSTREAM: ${{ github.workspace }}/../dbeaver-target
          DBEAVER_COMMON: ${{ github.workspace }}/../dbeaver-common
        run: ./scripts/build.sh
      - name: Build DBeaver CE product
        run: ../dbeaver-common/mvnw package -f ../dbeaver-target/product/aggregate/pom.xml -Pproduct-dbeaver-ce,product-dbeaver-eclipse-ce -DskipTests
      - name: Install and smoke runtime
        env:
          DBEAVER_UPSTREAM: ${{ github.workspace }}/../dbeaver-target
        run: |
          product=$(find ../dbeaver-target/product/community/target/products -path '*/linux/gtk/x86_64/dbeaver' -type d | head -1)
          repository=../dbeaver-target/product/repositories/org.jkiss.dbeaver.mcp.repository/target/repository
          PRODUCT_DIR="$product" REPOSITORY="$repository" ./scripts/install.sh
          PRODUCT_DIR="$product" ./scripts/runtime-smoke.sh
